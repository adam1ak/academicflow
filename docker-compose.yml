services:
  db:
    image: postgres:15
    container_name: academicflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: academicflow-redis
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: academicflow-api
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}

  frontend:
      build: ./webapp
      container_name: academicflow-frontend
      restart: on-failure
      ports:
        - "5173:5173"
      depends_on:
        - api