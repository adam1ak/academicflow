<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademicFlow - Planer Studiów</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="number"], input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #2980b9; }
        .result-box { margin-top: 30px; padding: 20px; background-color: #ecf0f1; border-radius: 5px; }
        .subject-card { background: white; padding: 10px; margin-bottom: 10px; border-left: 5px solid #3498db; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 AcademicFlow</h1>
    <p style="text-align: center;">Wygeneruj optymalny plan nauki z uwzględnieniem zależności.</p>

    <div class="form-group">
        <label for="maxConcurrent">Maksymalna liczba przedmiotów w jednym czasie (max_concurrent):</label>
        <input type="number" id="maxConcurrent" value="2" min="1">
    </div>

    <button onclick="generatePlan()">Wygeneruj Plan</button>

    <div id="loading" style="display: none; text-align: center; margin-top: 20px;">Trwa obliczanie...</div>
    
    <div class="result-box" id="resultContainer" style="display: none;">
        <h3>Twój Optymalny Harmonogram:</h3>
        <div id="planResults"></div>
    </div>
</div>

<script>
    const API_URL = "https://academicflow-api.onrender.com"; 

    async function generatePlan() {
        const maxConcurrent = parseInt(document.getElementById('maxConcurrent').value);
        const resultContainer = document.getElementById('resultContainer');
        const planResults = document.getElementById('planResults');
        const loading = document.getElementById('loading');

        resultContainer.style.display = 'none';
        loading.style.display = 'block';

        const payload = {
            max_concurrent: maxConcurrent,
            subjects: [
                { name: "Calculus 1", field: "math", duration: 2, dependents: ["Calculus 2", "Calculus 3"] },
                { name: "Calculus 2", field: "math", duration: 3, dependents: ["Calculus 3"] },
                { name: "Calculus 3", field: "math", duration: 5, dependents: [] },
                { name: "Basics of Language C", field: "programming", duration: 2, dependents: [] },
                { name: "English Language 1", field: "language", duration: 3, dependents: ["English Language 2"] },
                { name: "English Language 2", field: "language", duration: 5, dependents: [] }
            ]
        };

        try {
            const response = await fetch(`${API_URL}/api/v1/generate-plan`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Błąd serwera");

            const data = await response.json();
            
            // Rysujemy wyniki
            planResults.innerHTML = '';
            data.forEach(item => {
                planResults.innerHTML += `
                    <div class="subject-card">
                        <strong>${item.name}</strong><br>
                        Start: Tydzień ${item.start_time} | Koniec: Tydzień ${item.end_time}
                    </div>
                `;
            });

            loading.style.display = 'none';
            resultContainer.style.display = 'block';

        } catch (error) {
            console.error("Błąd:", error);
            alert("Nie udało się połączyć z API. Sprawdź konsolę i swój adres URL.");
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
